name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} submission compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes or prove an upstream catch-up
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check out trusted gate implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify no-mistakes signature in PR body
        id: signature
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
            echo 'found=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "${PR_BODY:-}" |
            bin/fm-no-mistakes-attestation.sh "$HEAD_SHA"; then
            echo "Found matching no-mistakes pipeline attestation in PR #${PR_NUMBER} body."
            echo 'found=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'found=false' >> "$GITHUB_OUTPUT"

      - name: Verify upstream catch-up from the commit graph
        if: steps.signature.outputs.found != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          repository_json=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY")
          upstream_url=$(printf '%s' "$repository_json" | jq -er '.parent.clone_url // empty') || upstream_url=
          upstream_default_branch=$(printf '%s' "$repository_json" | jq -er '.parent.default_branch // empty') || upstream_default_branch=
          if [ -z "$upstream_url" ] || [ -z "$upstream_default_branch" ]; then
            echo '::error::This PR has no no-mistakes signature, and the repository has no configured fork parent whose history can prove an upstream catch-up.' >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          fetched_head=$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head^{commit}")
          if [ "$fetched_head" != "$HEAD_SHA" ]; then
            echo "::error::Fetched PR head $fetched_head does not match event head $HEAD_SHA." >&2
            exit 1
          fi
          git remote add upstream "$upstream_url"
          git fetch --no-tags upstream \
            "+refs/heads/${upstream_default_branch}:refs/remotes/upstream/${upstream_default_branch}"
          bin/fm-no-mistakes-required.sh . "$BASE_SHA" "$HEAD_SHA" \
            "refs/remotes/upstream/${upstream_default_branch}"
